# ─────────────────────────────────────────
# C2P-PPO Configuration — CartPole
# ─────────────────────────────────────────

experiment:
  name: "c2p_ppo_cartpole"
  seed: 42
  device: "cpu"
  num_runs: 5

environment:
  name: "cartpole"
  task: "stabilization"
  max_steps: 500
  reset_on_violation: false

ppo:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  epochs: 10
  batch_size: 64
  n_steps: 2048
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

safety:
  delta_safety: 0.05
  tau_safe: 0.5
  lambda_0: 0.1
  lambda_lr: 5.0e-3
  lambda_r: 0.5
  eta: 2.0
  eps_mask: 1.0e-6

shielding:
  alpha_0: 0.8
  beta: 10.0
  window_size: 20
  c_threshold: 0.05

ctl:
  formula: "AG_safety"
  lookahead_k: 5
  n_rollouts: 10

checkpointing:
  save_every: 50
  keep_last: 5
  save_dir: "checkpoints"

logging:
  log_dir: "results/logs"
  plot_dir: "results/plots"
  table_dir: "results/tables"
  log_every: 10